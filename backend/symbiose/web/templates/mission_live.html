{% extends "base.html" %}
{% block title %}Mission {{ mission.id }} — live{% endblock %}
{% block content %}
<section class="space-y-4">
  <div>
    <div class="text-xs font-semibold text-violet-700 uppercase tracking-wide">Mission en cours</div>
    <h1 class="text-2xl font-bold tracking-tight mt-1">{{ mission.brief.title }}</h1>
  </div>

  <div class="p-5 bg-white rounded-xl border border-slate-200">
    <h2 class="font-semibold">Flux Mission Copilot</h2>
    <p class="text-xs text-slate-500 mb-3">Les événements arrivent en temps réel via Server-Sent Events.</p>
    <div id="events"
         hx-ext="sse"
         sse-connect="/mission/{{ mission.id }}/events"
         sse-swap="assistant_message,plan_update,skill_run_start,skill_run_result,quality_warning"
         hx-swap="beforeend"
         class="space-y-2 font-mono text-xs max-h-[60vh] overflow-auto">
    </div>
  </div>

  <div class="text-sm">
    <a href="/mission/{{ mission.id }}" class="text-slate-600 hover:text-slate-900 underline">← Retour au plan</a>
  </div>
</section>

<script>
// HTMX SSE raw fallback: append each event as a log line so users see everything.
document.body.addEventListener("htmx:sseMessage", (ev) => {
  const container = document.getElementById("events");
  if (!container) return;
  const row = document.createElement("div");
  row.className = "p-2 bg-slate-50 border border-slate-200 rounded";
  const type = ev.detail.type || "event";
  row.innerHTML = `<span class="text-violet-700 font-semibold">${type}</span> <span class="text-slate-700">${ev.detail.data}</span>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
});
</script>
{% endblock %}
