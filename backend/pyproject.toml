[project]
name = "symbiose"
version = "0.1.0"
description = "Symbiose MVP backend — skill-based agent platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
symbiose = "symbiose.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["symbiose*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
