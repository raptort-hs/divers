manifest_version: "1.0"

id: executive-summary-generator
name: "Executive Summary Generator"
version: "2.0.1"
created_at: "2026-03-01T09:00:00Z"
updated_at: "2026-04-12T15:00:00Z"

author:
  type: native
  id: symbiose
  display_name: "Symbiose Core Team"
source:
  kind: native
  license: "proprietary"

description:
  short:
    fr: "Transforme un livrable long en synthèse exécutive 1 page prête à envoyer."
    en: "Turns a long deliverable into a client-ready 1-page executive summary."
  long:
    fr: |
      Prend en entrée un document long (audit, étude, rapport) et produit une synthèse
      exécutive structurée : contexte 2 lignes, 3-5 findings clés, 3 recommandations
      priorisées, prochaines étapes. Ton : neutre, expert, décisionnel.
    en: |
      Takes a long document (audit, study, report) and produces a structured executive
      summary: 2-line context, 3-5 key findings, 3 prioritized recommendations, next
      steps. Tone: neutral, expert, decisional.
  intended_for:
    fr: "Tout talent avec un livrable long à condenser pour un dirigeant."
    en: "Any talent with a long deliverable to condense for an executive."
  non_goals:
    fr: "N'invente pas de données. Ne remplace pas une relecture finale par le talent."
    en: "Never invents data. Does not replace a final human review."

taxonomy:
  domains: ["consulting", "writing", "product"]
  sub_domains: ["synthesis", "executive-comm"]
  tags: ["deliverable-ready", "client-facing", "one-pager"]
  seniority_target: ["junior", "confirmed", "senior"]
  mission_phases: ["handover", "review"]
  languages: ["fr", "en"]

interface:
  inputs:
    - name: "source_document"
      type: "file:markdown|file:pdf"
      required: true
      description: "The long-form document to synthesize"
    - name: "audience"
      type: "string"
      required: true
      description: "Who reads this (e.g. 'dirigeant PME', 'CTO', 'conseil d'administration')"
    - name: "decision_required"
      type: "string"
      required: false
      description: "Explicit decision the executive must take after reading"
  outputs:
    - name: "executive_summary"
      type: "markdown"
      description: "1-page executive summary"
  preconditions:
    - "source_document is machine-readable"
  side_effects: []

tools:
  web_access: false
  file_access:
    read: ["mission_workspace/*"]
    write: ["mission_workspace/summaries/*"]
  depends_on_skills: []

runtime:
  llm:
    preferred: "claude-sonnet-4-6"
    tested: ["claude-opus-4-7", "claude-sonnet-4-6"]
    min_context_tokens: 40000
  offline: true
  estimated_cost_per_run: "€0.15"
  estimated_latency_p50: "30s"
  estimated_latency_p95: "60s"

safety:
  pii_handling: "none"
  data_egress: "none"
  injection_risk: "low"
  sandbox_level: "moderate"
  review_status: "certified-v1"
  reviewed_by: ["symbiose-safety-review-agent"]
  reviewed_at: "2026-04-01T10:00:00Z"
  human_oversight_required: false

governance:
  certified: true
  certification_level: "gold"
  usage_count: 0
  deprecated: false

economics:
  price_model: "per-run"
  price_tokens: 15
  author_share_pct: 0
  platform_share_pct: 100

lifecycle:
  status: "active"
  published_at: "2026-03-01T09:00:00Z"
