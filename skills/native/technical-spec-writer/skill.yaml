manifest_version: "1.0"

id: technical-spec-writer
name: "Technical Spec Writer"
version: "1.0.0"
created_at: "2026-04-01T09:00:00Z"
updated_at: "2026-04-15T10:00:00Z"

author:
  type: native
  id: symbiose
  display_name: "Symbiose Core Team"
source:
  kind: native
  license: "proprietary"

description:
  short:
    fr: "Rédige une spec technique structurée à partir d'un besoin fonctionnel."
    en: "Writes a structured technical spec from a functional need."
  long:
    fr: |
      Transforme un besoin fonctionnel (brief PME, user story, cahier des charges flou)
      en spec technique structurée : objectifs, périmètre, exigences fonctionnelles &
      non-fonctionnelles, API contracts, data model, sécurité, plan de tests, estimation
      effort. Format Markdown prêt à coller dans un tracker.
    en: |
      Turns a functional need into a structured tech spec: goals, scope, functional &
      non-functional requirements, API contracts, data model, security, test plan,
      effort estimation. Markdown-ready.
  intended_for:
    fr: "Talent tech (confirmé à senior) devant cadrer un chantier avant dev."
    en: "Tech talent (confirmed to senior) framing a build before dev."
  non_goals:
    fr: "N'invente pas d'exigences. Ne chiffre pas à la place d'un dev."
    en: "Doesn't invent requirements. Doesn't estimate in lieu of a dev."

taxonomy:
  domains: ["engineering", "software", "product"]
  sub_domains: ["spec", "architecture", "api-design"]
  tags: ["deliverable-ready", "internal", "technical"]
  seniority_target: ["confirmed", "senior", "expert"]
  mission_phases: ["design", "build"]
  languages: ["fr", "en"]

interface:
  inputs:
    - name: "functional_need"
      type: "string|file:markdown"
      required: true
      description: "Le besoin fonctionnel, brief ou user story"
    - name: "tech_constraints"
      type: "array<string>"
      required: false
      description: "Contraintes connues : stack imposée, budget, délai, compliance"
    - name: "audience"
      type: "string"
      required: false
      description: "Dev lead, CTO externe, prestataire, équipe interne"
  outputs:
    - name: "tech_spec"
      type: "markdown"
      description: "Spec technique structurée"
    - name: "open_questions"
      type: "structured:list"
      description: "Questions à trancher avant dev"
  preconditions: []
  side_effects: []

tools:
  web_access: false
  file_access:
    read: ["mission_workspace/*"]
    write: ["mission_workspace/specs/*"]
  depends_on_skills: []

runtime:
  llm:
    preferred: "claude-opus-4-7"
    tested: ["claude-opus-4-7", "claude-sonnet-4-6"]
    min_context_tokens: 40000
  offline: true
  estimated_cost_per_run: "€0.50"
  estimated_latency_p50: "60s"
  estimated_latency_p95: "120s"

safety:
  pii_handling: "none"
  data_egress: "none"
  injection_risk: "low"
  sandbox_level: "moderate"
  review_status: "certified-v1"
  reviewed_by: ["symbiose-safety-review-agent"]
  reviewed_at: "2026-04-10T10:00:00Z"
  human_oversight_required: false

governance:
  certified: true
  certification_level: "bronze"
  usage_count: 0
  deprecated: false

economics:
  price_model: "per-run"
  price_tokens: 30
  author_share_pct: 0
  platform_share_pct: 100

lifecycle:
  status: "active"
  published_at: "2026-04-01T09:00:00Z"
